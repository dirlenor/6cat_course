  <body data-checkout-status-endpoint="https://qmayxfnadhqzilwrtepx.supabase.co/functions/v1/checkout-status">
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1558326832065479&amp;ev=PageView&amp;noscript=1" alt="" /></noscript>
    <main class="booking-return">
      <a class="booking-brand" href="./index.html" aria-label="กลับไปหน้า 6CAT Academy">
        <img class="booking-brand__logo" src="./assets/brand/6cat-academy-logo.png" alt="6CAT Academy — Create. Build. Grow." />
      </a>
      <section class="booking-return__card" aria-live="polite">
        <p class="booking-return__eyebrow">PAYMENT STATUS</p>
        <h1 data-payment-heading>กำลังยืนยัน<br />การชำระเงิน</h1>
        <p data-payment-message>กำลังตรวจสอบกับระบบ โปรดรอสักครู่</p>
        <p class="booking-return__loading">กำลังเปิดใบยืนยันการจองของคุณ</p>
      </section>
    </main>
    <script>
      const heading = document.querySelector("[data-payment-heading]");
      const message = document.querySelector("[data-payment-message]");
      const sessionId = new URLSearchParams(window.location.search).get("session_id");
      const endpoint = document.body.dataset.checkoutStatusEndpoint;
      let attempts = 0;

      async function checkPayment() {
        if (!sessionId) {
          message.textContent = "ไม่พบรายการชำระเงิน กรุณาติดต่อเราผ่าน LINE";
          return;
        }
        try {
          const response = await fetch(`${endpoint}?session_id=${encodeURIComponent(sessionId)}`);
          const result = await response.json();
          if (result.status === "paid" && result.booking) {
            window.location.replace(`./booking-invoice.html?session_id=${encodeURIComponent(sessionId)}`);
            return;
          }
          attempts += 1;
          if (attempts < 8) return window.setTimeout(checkPayment, 1500);
          message.textContent = "เราได้รับรายการแล้วและกำลังยืนยันการชำระเงิน หากไม่ได้รับอีเมล กรุณาติดต่อเราผ่าน LINE";
        } catch {
          message.textContent = "กำลังยืนยันการชำระเงิน กรุณาตรวจสอบอีเมล หรือทัก LINE หากต้องการความช่วยเหลือ";
        }
      }

      checkPayment();
    </script>
  </body>
</html>
