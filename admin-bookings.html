<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>จัดการการจอง | 6CAT Academy</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body { min-height: 100dvh; background: #f5f1ed; color: #111; }
      .admin-shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 72px; }
      .admin-shell--auth { width: 100%; min-height: 100dvh; padding: 0; }
      .admin-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid #d9d1c8; }
      .admin-top[hidden] { display: none; }
      .admin-brand img { display: block; width: 170px; height: auto; }
      .admin-card { margin-top: 32px; background: #fffdfa; border: 1px solid #d9d1c8; border-radius: 18px; padding: 30px; }
      .admin-card h1 { margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1; }
      .admin-subtitle { margin: 0; color: #6c655f; }
      .admin-login { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(400px, .92fr); min-height: min(720px, calc(100dvh - 64px)); margin: 0; overflow: hidden; border: 18px solid #151d18; border-radius: 34px; padding: 0; background: #151d18; box-shadow: 0 26px 56px rgba(17, 24, 20, .22); }
      .admin-shell--auth .admin-login { width: 100%; min-height: 100dvh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      .admin-auth__visual { position: relative; min-height: 100%; overflow: hidden; background: #1a1918; }
      .admin-auth__visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .08), transparent 58%, rgba(21, 29, 24, .28)); pointer-events: none; }
      .admin-auth__visual img { display: block; width: 100%; height: 100%; min-height: 650px; object-fit: cover; object-position: 50% center; }
      .admin-auth__form { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: clamp(42px, 7vw, 88px) clamp(30px, 5vw, 68px); border-radius: 22px; background: #fffdfa; }
      .admin-shell--auth .admin-auth__form { border-radius: 0; }
      .admin-auth__logo { display: block; width: min(190px, 58%); height: auto; margin-bottom: clamp(44px, 7vh, 82px); }
      .admin-login h1 { margin: 0 0 14px; font-size: clamp(2.5rem, 4.5vw, 4.5rem); line-height: .93; letter-spacing: -.065em; }
      .admin-login .admin-subtitle { max-width: 340px; font-size: 1rem; line-height: 1.6; }
      .admin-field { display: grid; gap: 7px; margin-top: 18px; font-weight: 700; }
      .admin-login form { margin-top: 28px; }
      .admin-field input, .admin-filter { width: 100%; box-sizing: border-box; border: 1px solid #cfc7bd; border-radius: 10px; padding: 13px 14px; background: #fff; font: inherit; }
      .admin-field input:focus, .admin-filter:focus { outline: 3px solid rgba(255, 77, 10, .18); border-color: #ff4d0a; }
      .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
      .admin-button { border: 0; border-radius: 10px; background: #ff4d0a; color: #fff; cursor: pointer; font: inherit; font-weight: 800; padding: 13px 18px; }
      .admin-login .admin-actions { display: block; }
      .admin-login .admin-button[type="submit"] { width: 100%; min-height: 52px; border-radius: 12px; font-size: 1rem; }
      .admin-button--quiet { background: #111; }
      .admin-login .admin-button--quiet { width: 100%; margin-top: 10px; padding: 7px 0; background: transparent; color: #5f5a55; font-size: .9rem; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
      .admin-button:disabled { cursor: wait; opacity: .6; }
      .admin-message { min-height: 1.4em; margin: 16px 0 0; color: #b42318; }
      .admin-dashboard[hidden], .admin-login[hidden] { display: none; }
      .admin-controls { display: grid; grid-template-columns: 1fr minmax(180px, 220px) auto; gap: 12px; margin: 28px 0 18px; }
      .admin-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
      .admin-stat { background: #111; color: #fff; border-radius: 14px; padding: 18px; }
      .admin-stat span { display: block; color: #cfc7bd; font-size: .78rem; font-weight: 800; letter-spacing: .08em; }
      .admin-stat strong { display: block; margin-top: 8px; font-size: 1.8rem; }
      .admin-table-wrap { overflow-x: auto; border: 1px solid #ded7cf; border-radius: 12px; }
      table { width: 100%; border-collapse: collapse; min-width: 860px; }
      th, td { padding: 14px 16px; border-bottom: 1px solid #ebe5df; text-align: left; vertical-align: top; }
      th { background: #faf7f3; color: #6c655f; font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .admin-status { display: inline-block; border-radius: 999px; background: #dcfce7; color: #166534; padding: 5px 9px; font-size: .78rem; font-weight: 800; }
      .admin-detail { display: block; color: #6c655f; font-size: .84rem; line-height: 1.5; }
      @media (max-width: 820px) { .admin-login { grid-template-columns: 1fr; min-height: auto; border-width: 12px; border-radius: 24px; } .admin-auth__visual { min-height: 235px; } .admin-auth__visual img { min-height: 235px; object-position: 50% 32%; } .admin-auth__form { padding: 34px 26px 40px; border-radius: 12px; } .admin-auth__logo { width: min(174px, 60%); margin-bottom: 34px; } .admin-login h1 { font-size: clamp(2.35rem, 12vw, 3.7rem); } }
      @media (max-width: 720px) { .admin-shell { width: min(100% - 28px, 1180px); padding-top: 14px; } .admin-top { align-items: flex-start; flex-direction: column; } .admin-controls, .admin-summary { grid-template-columns: 1fr; } .admin-card { padding: 20px; } .admin-login { padding: 0; } }
    </style>
  </head>
  <body>
      <main class="admin-shell admin-shell--auth" data-page-shell>
      <header class="admin-top" data-site-header hidden>
        <a class="admin-brand" href="./index.html" aria-label="กลับหน้า 6CAT Academy"><img src="./assets/brand/6cat-academy-logo.png" alt="6CAT Academy" /></a>
        <a href="./index.html">← กลับหน้าเว็บไซต์</a>
      </header>

      <section class="admin-card admin-login" data-login-panel>
        <div class="admin-auth__visual" aria-hidden="true"><img src="./assets/sec6/instructor-visual-dark.png" alt="" /></div>
        <div class="admin-auth__form">
          <img class="admin-auth__logo" src="./assets/brand/6cat-academy-logo.png" alt="6CAT Academy" />
          <h1>จัดการ<br />การจองคอร์ส</h1>
          <p class="admin-subtitle">เข้าสู่ระบบเพื่อดูรายชื่อผู้เรียนที่ชำระเงินแล้ว</p>
          <form data-login-form>
            <label class="admin-field">อีเมลแอดมิน<input name="email" type="email" autocomplete="username" required /></label>
            <label class="admin-field">รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required /></label>
            <div class="admin-actions"><button class="admin-button" type="submit">เข้าสู่ระบบ</button><button class="admin-button admin-button--quiet" type="button" data-signup>ยังไม่มีบัญชี? สร้างบัญชีครั้งแรก</button></div>
            <p class="admin-message" data-login-message aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section class="admin-card admin-dashboard" data-dashboard hidden>
        <p class="booking-return__eyebrow">6CAT BOOKINGS</p>
        <h1>ผู้ลงทะเบียนซื้อคอร์ส</h1>
        <p class="admin-subtitle" data-admin-email></p>
        <div class="admin-summary">
          <div class="admin-stat"><span>ชำระแล้ว</span><strong data-count>0</strong></div>
          <div class="admin-stat"><span>ยอดรวม</span><strong data-total>฿0</strong></div>
          <div class="admin-stat"><span>แพ็กเกจ</span><strong data-packages>0</strong></div>
        </div>
        <div class="admin-controls">
          <input class="admin-filter" type="search" placeholder="ค้นหาชื่อ อีเมล เบอร์โทร หรือ LINE ID" data-search />
          <select class="admin-filter" data-package-filter><option value="">ทุกแพ็กเกจ</option><option value="online-course">Online Course</option><option value="live-online">Private Live Online</option><option value="solo">Solo</option><option value="buddy">Buddy</option></select>
          <button class="admin-button admin-button--quiet" type="button" data-export>Export CSV</button>
        </div>
        <div class="admin-table-wrap"><table><thead><tr><th>ผู้ซื้อ</th><th>แพ็กเกจ</th><th>ยอดชำระ</th><th>ข้อมูลเรียน</th><th>ชำระเมื่อ</th><th>สถานะ</th></tr></thead><tbody data-bookings></tbody></table></div>
        <p class="admin-message" data-dashboard-message aria-live="polite"></p>
        <div class="admin-actions"><button class="admin-button admin-button--quiet" type="button" data-logout>ออกจากระบบ</button></div>
      </section>
    </main>
    <script>
      const supabaseUrl = "https://qmayxfnadhqzilwrtepx.supabase.co";
      const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYXl4Zm5hZGhxemlsd3J0ZXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDExNTUsImV4cCI6MjEwNDA3NzE1NX0.bqjBAT40wb15awnsRX-F7eDpGOM2rXdfZO_g43HPYn4";
      const pageShell = document.querySelector("[data-page-shell]");
      const siteHeader = document.querySelector("[data-site-header]");
      const loginPanel = document.querySelector("[data-login-panel]");
      const dashboard = document.querySelector("[data-dashboard]");
      const loginForm = document.querySelector("[data-login-form]");
      const loginMessage = document.querySelector("[data-login-message]");
      const dashboardMessage = document.querySelector("[data-dashboard-message]");
      const bookingsBody = document.querySelector("[data-bookings]");
      const searchInput = document.querySelector("[data-search]");
      const packageFilter = document.querySelector("[data-package-filter]");
      let accessToken = "";
      let bookings = [];

      const money = (amount) => new Intl.NumberFormat("th-TH", { style: "currency", currency: "THB", maximumFractionDigits: 0 }).format(amount || 0);
      const dateTime = (value) => value ? new Intl.DateTimeFormat("th-TH", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value)) : "-";
      const escapeHtml = (value) => String(value || "-").replace(/[&<>'\"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" })[char]);

      async function auth(path, body) {
        const response = await fetch(`${supabaseUrl}/auth/v1/${path}`, { method: "POST", headers: { apikey: supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.msg || result.message || "เข้าสู่ระบบไม่สำเร็จ");
        return result;
      }

      function render() {
        const term = searchInput.value.trim().toLowerCase();
        const selectedPackage = packageFilter.value;
        const visible = bookings.filter((booking) => {
          const searchable = [booking.customer_name, booking.customer_email, booking.customer_phone, booking.line_id].join(" ").toLowerCase();
          return (!term || searchable.includes(term)) && (!selectedPackage || booking.package_code === selectedPackage);
        });
        bookingsBody.innerHTML = visible.map((booking) => `<tr><td><strong>${escapeHtml(booking.customer_name)}</strong><span class="admin-detail">${escapeHtml(booking.customer_email)}<br />${escapeHtml(booking.customer_phone)}${booking.line_id ? `<br />LINE: ${escapeHtml(booking.line_id)}` : ""}</span></td><td><strong>${escapeHtml(booking.package_code.replaceAll("-", " "))}</strong>${booking.buddy_name ? `<span class="admin-detail">คู่เรียน: ${escapeHtml(booking.buddy_name)}</span>` : ""}</td><td>${money(booking.amount_thb)}</td><td><span class="admin-detail">${booking.requested_slot ? `รอบ: ${escapeHtml(booking.requested_slot)}<br />` : ""}${booking.requested_location ? `สถานที่: ${escapeHtml(booking.requested_location)}<br />` : ""}${booking.customer_note ? `หมายเหตุ: ${escapeHtml(booking.customer_note)}` : "-"}</span></td><td>${dateTime(booking.paid_at || booking.created_at)}</td><td><span class="admin-status">${escapeHtml(booking.status)}</span></td></tr>`).join("") || "<tr><td colspan=\"6\">ไม่พบรายการ</td></tr>";
      }

      function downloadCsv() {
        const headings = ["ชื่อ", "อีเมล", "เบอร์โทร", "LINE ID", "แพ็กเกจ", "ยอดเงิน", "รอบเรียน", "สถานที่", "สถานะ", "ชำระเมื่อ"];
        const rows = bookings.map((booking) => [booking.customer_name, booking.customer_email, booking.customer_phone, booking.line_id, booking.package_code, booking.amount_thb, booking.requested_slot, booking.requested_location, booking.status, booking.paid_at]);
        const csv = [headings, ...rows].map((row) => row.map((value) => `"${String(value || "").replaceAll('"', '""')}"`).join(",")).join("\n");
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
        link.download = `6cat-paid-bookings-${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      async function loadBookings() {
        dashboardMessage.textContent = "กำลังโหลดข้อมูล...";
        const query = new URLSearchParams({ select: "id,package_code,amount_thb,customer_name,customer_phone,customer_email,line_id,buddy_name,requested_slot,requested_location,customer_note,status,paid_at,created_at", status: "eq.paid", order: "paid_at.desc" });
        const response = await fetch(`${supabaseUrl}/rest/v1/bookings?${query}`, { headers: { apikey: supabaseKey, Authorization: `Bearer ${accessToken}` } });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "ไม่สามารถโหลดรายการจองได้");
        bookings = result;
        document.querySelector("[data-count]").textContent = bookings.length;
        document.querySelector("[data-total]").textContent = money(bookings.reduce((sum, booking) => sum + booking.amount_thb, 0));
        document.querySelector("[data-packages]").textContent = new Set(bookings.map((booking) => booking.package_code)).size;
        dashboardMessage.textContent = "";
        render();
      }

      async function openDashboard(session) {
        accessToken = session.access_token;
        document.querySelector("[data-admin-email]").textContent = session.user.email;
        loginPanel.hidden = true;
        pageShell.classList.remove("admin-shell--auth");
        siteHeader.hidden = false;
        dashboard.hidden = false;
        try { await loadBookings(); } catch (error) { dashboardMessage.textContent = error.message; }
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = new FormData(loginForm);
        loginMessage.textContent = "กำลังเข้าสู่ระบบ...";
        try { await openDashboard(await auth("token?grant_type=password", { email: form.get("email"), password: form.get("password") })); } catch (error) { loginMessage.textContent = error.message; }
      });

      document.querySelector("[data-signup]").addEventListener("click", async () => {
        const form = new FormData(loginForm);
        if (!loginForm.reportValidity()) return;
        loginMessage.textContent = "กำลังสร้างบัญชี...";
        try {
          const result = await auth("signup", { email: form.get("email"), password: form.get("password"), email_redirect_to: `${location.origin}/admin-bookings.html` });
          if (result.session) await openDashboard(result.session);
          else loginMessage.textContent = "สร้างบัญชีแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ";
        } catch (error) { loginMessage.textContent = error.message; }
      });

      searchInput.addEventListener("input", render);
      packageFilter.addEventListener("change", render);
      document.querySelector("[data-export]").addEventListener("click", downloadCsv);
      document.querySelector("[data-logout]").addEventListener("click", () => { accessToken = ""; bookings = []; dashboard.hidden = true; siteHeader.hidden = true; pageShell.classList.add("admin-shell--auth"); loginPanel.hidden = false; loginForm.reset(); });
    </script>
  </body>
</html>
